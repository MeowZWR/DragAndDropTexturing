name: Build

on:
  push:
    branches: '*'
    tags-ignore: '*'
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release --nologo

      - name: Archive
        run: Compress-Archive -Path DragAndDropTexturing/bin/x64/Release/* -DestinationPath DragAndDropTexturing.zip

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragAndDropTexturing
          path: ./DragAndDropTexturing/bin/x64/Release/*
