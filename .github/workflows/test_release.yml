on:
  push:
    tags:
      - 'testing_*-cn'

name: Testing Release

jobs:
  release:
    name: Testing Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: |
          $ver = '${{ github.ref_name }}' -replace '^testing_','' -replace '-cn$',''
          dotnet build --no-restore -c Release --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver

      - name: Write version into manifest
        run: |
          $ver = '${{ github.ref_name }}' -replace '^testing_','' -replace '-cn$',''
          $path = './DragAndDropTexturing/bin/x64/Release/DragAndDropTexturing.json'
          $content = Get-Content -Path $path
          $content = $content -replace '0.0.0.0',$ver
          Set-Content -Path $path -Value $content

      - name: Packing Release
        run: |
          pushd DragAndDropTexturing/bin/x64/Release/
          7z a ../DragAndDropTexturing.zip *
          popd
        shell: bash

      - name: Create Release
        uses: ncipollo/release-action@v1.12.0
        with:
          name: DragAndDropTexturing ${{ github.ref_name }} (Testing)
          artifacts: "./DragAndDropTexturing/bin/x64/*.zip"
          tag: ${{ github.ref_name }}
          prerelease: true
          body: "Testing build of Drag And Drop Texturing. Opt-in via Dalamud settings. Do not install this manually."
          omitBodyDuringUpdate: true
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write out repo.json
        run: |
          $tag = '${{ github.ref_name }}'
          $ver = $tag -replace '^testing_','' -replace '-cn$',''
          $repo = '${{ github.repository }}'
          $downloadUrl = "https://meowrs.com/https://github.com/$repo/releases/download/$tag/DragAndDropTexturing.zip"
          $path = './repo.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json[0].TestingAssemblyVersion = $ver
          $json[0].DownloadLinkTesting = $downloadUrl
          $content = ConvertTo-Json @($json) -Depth 10
          Set-Content -Path $path -Value $content

      - name: Commit repo.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git config --global user.name "Actions User"
          git config --global user.email "actions@github.com"
          git fetch origin cn
          git branch -f cn ${{ github.sha }}
          git checkout cn
          git add repo.json
          git commit -m "[CI] Updating repo.json for testing build ${{ github.ref_name }}" || true
          git push origin cn

  trigger_workflow:
    name: Trigger DalamudPlugin CI
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Workflow in DalamudPlugin Repository
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MEOWRSTRIGGER }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MeowZWR/DalamudPlugin/dispatches \
            -d '{"event_type": "request-update-run-action", "client_payload": {"unit": false, "integration": true}}'
